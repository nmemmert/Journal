# Local development override — builds from source instead of pulling the image.
# Docker Compose merges this automatically when present.
#
#   docker compose up --build
#
services:
  journal:
    build: .
    image: journal:local
    ports:
      - "3000:3000"
    depends_on: {}

  caddy:
    profiles: ["prod"]   # exclude Caddy when running locally
