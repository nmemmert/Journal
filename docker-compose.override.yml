# Local development override — builds from source instead of pulling the image.
# Docker Compose merges this automatically when present.
#
#   docker compose up --build
#
services:
  journal:
    build: .
    image: journal:local
    environment:
      DATABASE_URL: "file:/data/journal.db"
      JWT_SECRET: "${JWT_SECRET:-dev-secret-change-in-production}"
      NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL:-http://localhost:3000}"
      NODE_ENV: "production"
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    depends_on: {}

  caddy:
    profiles: ["prod"]   # exclude Caddy when running locally
