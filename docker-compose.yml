services:
  journal:
    image: ghcr.io/nmemmert/journal:main
    environment:
      DATABASE_URL: "file:/data/journal.db"
      JWT_SECRET: "change-this-to-a-long-random-secret"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NODE_ENV: "production"
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    volumes:
      - db-data:/data
      - uploads:/app/public/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/auth/me"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  db-data:
  uploads:
